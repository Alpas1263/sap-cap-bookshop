<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitap Yönetimi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <p class="eyebrow">SAP CAP Bookshop</p>
        <h1>Kitap Yönetimi</h1>
        <p class="subtitle">Kitap kayıtlarını görüntüleyin, ekleyin, düzenleyin veya silin.</p>
      </div>
      <button id="add-book" class="button primary" type="button">Yeni Kitap Ekle</button>
    </header>
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    <section class="table-card" aria-labelledby="table-title">
      <div class="table-heading">
        <h2 id="table-title">Kitaplar</h2>
        <button id="refresh" class="button secondary" type="button">Yenile</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>ID</th><th>Kitap Adı</th><th>Stok</th><th>Fiyat</th><th>İşlemler</th></tr></thead>
          <tbody id="books-body"><tr><td class="state-cell" colspan="5">Kitaplar yükleniyor…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <dialog id="book-dialog">
    <form id="book-form">
      <div class="dialog-header">
        <h2 id="dialog-title">Yeni Kitap Ekle</h2>
        <button id="close-dialog" class="icon-button" type="button" aria-label="Pencereyi kapat">×</button>
      </div>
      <div class="form-grid">
        <label>ID<input id="book-id" type="number" step="1" required></label>
        <label class="wide">Kitap Adı<input id="book-title" type="text" maxlength="255" required></label>
        <label>Stok<input id="book-stock" type="number" min="0" step="1" required></label>
        <label>Fiyat<input id="book-price" type="number" min="1" max="111" step="0.01" required></label>
        <div id="relation-fields" class="relation-fields wide">
          <label>Yazar<select id="book-author" required></select></label>
          <label>Tür<select id="book-genre" required></select></label>
          <small>Mevcut servis doğrulamaları için yazar ve tür seçilmelidir.</small>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="cancel-dialog" class="button secondary" type="button">İptal</button>
        <button id="save-book" class="button primary" type="submit">Kaydet</button>
      </div>
    </form>
  </dialog>
  <script src="app.js" defer></script>
</body>
</html>
